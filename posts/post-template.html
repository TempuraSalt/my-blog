<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>記事タイトル</title> <!-- JSで完全なタイトルに置換されます -->

  <!-- SEO / metadata (generate_posts_json.js がこれらを読む) -->
  <meta name="description" content="この記事の短い説明（excerpt）">
  <meta name="date" content="2025-08-14">
  <meta name="tags" content="タグ1,タグ2">
  <meta name="cover" content="/my-blog/images/test-sample.jpg">

  <!-- Canonical URL -->
  <link rel="canonical" href=""> <!-- generate_sitemap.js で設定されるため空でOK -->

  <!-- OGP / SNS用 -->
  <meta property="og:site_name" content="ブログ・ザ・ブログ-built by AI">
  <meta property="og:type" content="article">
  <meta property="og:title" content=""> <!-- JSで設定 -->
  <meta property="og:description" content=""> <!-- JSで設定 -->
  <meta property="og:image" content=""> <!-- JSで設定 -->
  <meta property="og:url" content=""> <!-- generate_sitemap.js で設定されるため空でOK -->

  <link rel="stylesheet" href="/my-blog/style.css">
  <script src="/my-blog/common.js" defer></script>
</head>
<body>
  <div id="site-header"></div>

  <main class="container" data-page-type="post">
    <div id="breadcrumb-container"></div>

    <article class="post-card">
      <h1>記事タイトル</h1>
      <div class="post-meta" data-post-element="meta"></div>

      <!-- カバー画像 -->
      <div data-post-element="cover-container"></div>

      <div class="post-body">
        <p>本文はここに書きます。段落ごとに &lt;p&gt; を使ってください。</p>
        <p>画像は /my-blog/images/ 以下に置いて相対パスで指定します。</p>
      </div>
    </article>

    <div id="post-footer-nav"></div>
  </main>

  <div id="site-footer"></div>
</body>
</html>
